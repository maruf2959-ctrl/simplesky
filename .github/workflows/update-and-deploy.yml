name: Update listings & deploy site

on:
  schedule:
    - cron: '17 5 * * *'   # every day, 05:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['data/listings.json', 'data/history.json', 'data/news.json']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch latest listings
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: node scripts/update-listings.mjs
      - name: Fetch astronomy news
        run: node scripts/update-news.mjs
      - name: Run tests
        run: node --test
      - name: Commit data if it changed
        run: |
          git config user.name "camera-finder-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/listings.json data/history.json data/news.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update listings and news $(date -u +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
