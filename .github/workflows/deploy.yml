name: Deploy site

# Deploys the app to GitHub Pages when main changes, or when run by hand.
# No schedule and no data collection here: price and news data are refreshed
# by running scripts/update-listings.mjs and scripts/update-news.mjs manually,
# and the results are committed by a person. (A daily automated job on a new
# account was flagged by GitHub's abuse detection in Oct 2026.)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: node --test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
