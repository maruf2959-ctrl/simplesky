<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SimpleSky</title>
  <meta name="description" content="An all-round stargazing companion: tonight's sky for your telescope, weather, events, your kit and live UK gear prices.">
  <meta name="theme-color" content="#03050d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SimpleSky">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="icon" href="assets/favicon-64.png" type="image/png">
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>
  <div id="redFilter" aria-hidden="true"></div>

  <header class="appbar">
    <h1 id="viewTitle">SimpleSky</h1>
    <div class="appbar-actions">
      <a href="#map" class="loc-pill" id="locPill" aria-label="Location and sky map">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.3-7-11.5a7 7 0 0 1 14 0C19 14.7 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
        <span id="locName">Worthing</span>
      </a>
      <button id="redToggle" class="icon-btn" aria-pressed="false" aria-label="Red night mode" title="Red night mode">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section id="view-home" class="view" data-title="SimpleSky"></section>
    <section id="view-tonight" class="view" data-title="Tonight"></section>
    <section id="view-events" class="view" data-title="Events"></section>
    <section id="view-kit" class="view" data-title="My Kit"></section>
    <section id="view-map" class="view" data-title="Location &amp; sky"></section>
    <section id="view-explore" class="view" data-title="Explore"></section>
  </main>

  <nav class="tabbar" aria-label="Main">
      <a href="#home" data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></a>
      <a href="#tonight" data-tab="tonight"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg><span>Tonight</span></a>
      <a href="#explore" data-tab="explore"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M3.2 15.6c-1-1.8 3.2-5.2 8.8-7.3s10.1-2.2 10.8-.5-3.3 5.2-8.9 7.3-9.8 2.3-10.7.5z"/></svg><span>Explore</span></a>
      <a href="#events" data-tab="events"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2v3M17 2v3M3.5 9h17M5 4.5h14a1.5 1.5 0 0 1 1.5 1.5v13a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 19V6A1.5 1.5 0 0 1 5 4.5z"/></svg><span>Events</span></a>
      <a href="#kit" data-tab="kit"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15l11-6 2 3.5-11 6zM15 9l3-1.6 2 3.5-3 1.6M9 17.6L7 22M11 16.5L13 22"/></svg><span>My Kit</span></a>
  </nav>

  <script src="assets/astro.js"></script>
  <script src="assets/conditions.js"></script>
  <script src="assets/core.js"></script>
  <script src="assets/rating.js"></script>
  <script src="assets/views/objinfo.js"></script>
  <script src="assets/views/home.js"></script>
  <script src="assets/views/tonight.js"></script>
  <script src="assets/views/events.js"></script>
  <script src="assets/views/kit.js"></script>
  <script src="assets/views/map.js"></script>
  <script src="assets/views/explore.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>
  <script>App.start();</script>
</body>
</html>
